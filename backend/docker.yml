services:
  db:
    image: postgres:18
    container_name: postgres_18_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marwen
      POSTGRES_PASSWORD: marwen123
      POSTGRES_DB: cloudForg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marwen -d cloudForg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin_web
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: marwen@example.com
      PGADMIN_DEFAULT_PASSWORD: marwen123
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy


  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    hostname: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
